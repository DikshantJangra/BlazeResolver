name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Widget parses
        run: node --check widget/widget.js
      # Every user's workflow runs blazeresolver@latest, so the published package must install and run on its own.
      - name: Packed CLI runs
        run: |
          npm pack --silent --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/blazeresolver-*.tgz
          npx blazeresolver --help
          node -e "import('blazeresolver/handler').then((m) => { if (!m.createHandler) process.exit(1) })"
